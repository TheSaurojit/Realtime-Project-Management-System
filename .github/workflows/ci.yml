name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: project_management
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5433/project_management?schema=public"
      JWT_SECRET: "ci-pipeline-mock-secret-key-at-least-32-characters"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://your-project-id.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "mock-publishable-key-for-ci"
      SUPABASE_SECRET_KEY: "mock-secret-key-for-ci"
      SUPABASE_STORAGE_BUCKET: "attachments"
      PUSHER_APP_ID: "ci-mock-pusher-app-id"
      NEXT_PUBLIC_PUSHER_KEY: "ci-mock-pusher-key"
      PUSHER_SECRET: "ci-mock-pusher-secret"
      NEXT_PUBLIC_PUSHER_CLUSTER: "mt1"
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Push Prisma Schema to PostgreSQL
        run: npx prisma db push --accept-data-loss

      - name: Run Test Suite
        run: npm test

      - name: Build Application
        run: npm run build
